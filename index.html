<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cash App Bitcoin Direct</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-black text-white flex flex-col justify-between min-h-screen max-w-md mx-auto select-none p-6">

  <!-- Header / Live Rate -->
  <div class="flex justify-between items-center pt-2">
    <div class="flex items-center space-x-2 bg-neutral-900 border border-neutral-800 px-3 py-1.5 rounded-full">
      <span class="w-2.5 h-2.5 bg-[#00D632] rounded-full animate-pulse"></span>
      <span class="text-xs font-semibold text-neutral-300">Cash App BTC Pay</span>
    </div>
    <div class="text-xs font-mono text-neutral-400 bg-neutral-900 border border-neutral-800 px-3 py-1.5 rounded-full">
      <span id="liveRate">Fetching rate...</span>
    </div>
  </div>

  <!-- Keypad Display -->
  <div class="flex flex-col items-center justify-center my-auto py-8">
    <div class="flex items-baseline justify-center font-extrabold text-[#00D632] tracking-tight">
      <span class="text-4xl sm:text-5xl mr-1 font-bold">$</span>
      <span id="displayAmount" class="text-6xl sm:text-7xl">0</span>
    </div>
    <div class="mt-3 flex items-center space-x-1 bg-neutral-900/80 border border-neutral-800 px-4 py-1.5 rounded-full">
      <span class="text-amber-400 text-sm font-bold">₿</span>
      <span id="btcAmount" class="text-neutral-300 font-mono text-sm">0.00000000</span>
    </div>
  </div>

  <!-- Keypad & Pay Button -->
  <div class="w-full">
    <div class="grid grid-cols-3 gap-y-3 gap-x-6 text-center text-2xl font-bold mb-6">
      <button onclick="pressKey('1')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">1</button>
      <button onclick="pressKey('2')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">2</button>
      <button onclick="pressKey('3')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">3</button>
      <button onclick="pressKey('4')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">4</button>
      <button onclick="pressKey('5')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">5</button>
      <button onclick="pressKey('6')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">6</button>
      <button onclick="pressKey('7')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">7</button>
      <button onclick="pressKey('8')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">8</button>
      <button onclick="pressKey('9')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">9</button>
      <button onclick="pressKey('.')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">.</button>
      <button onclick="pressKey('0')" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl transition">0</button>
      <button onclick="deleteKey()" class="py-3.5 hover:bg-neutral-900 active:bg-neutral-800 rounded-2xl flex items-center justify-center transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-neutral-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z" />
        </svg>
      </button>
    </div>

    <!-- Submit Payment -->
    <button 
      onclick="executeCashAppRedirect()" 
      class="w-full bg-[#00D632] hover:bg-[#00ba2b] active:scale-[0.98] text-black font-extrabold text-lg py-4 rounded-full transition shadow-lg shadow-green-500/20"
    >
      Pay with Cash App
    </button>
  </div>

  <!-- QR Fallback Modal for Desktop -->
  <div id="qrModal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-6 z-50">
    <div class="bg-neutral-900 border border-neutral-800 p-6 rounded-3xl w-full max-w-xs text-center">
      <h3 class="text-lg font-bold mb-1">Scan to Send</h3>
      <p class="text-xs text-neutral-400 mb-5">Open Cash App scanner to complete payment</p>
      <div id="qrcode" class="p-3 bg-white rounded-2xl inline-block mx-auto mb-4"></div>
      <p id="modalBtc" class="font-mono text-xs text-amber-400 font-semibold mb-4"></p>
      <button onclick="closeModal()" class="w-full bg-neutral-800 hover:bg-neutral-700 text-neutral-300 font-semibold py-2.5 rounded-full text-sm">
        Close
      </button>
    </div>
  </div>

  <script>
    // Paste your Bitcoin Mainnet address here (e.g. from Binance)
    const BTC_ADDRESS = "144riwNanTYo6V3PpznqhUnmqFZtkJKSt8";

    let rawAmount = "0";
    let btcRate = 0;

    async function initExchangeRate() {
      try {
        const res = await fetch("https://api.coinbase.com/v2/prices/spot?currency=USD");
        const json = await res.json();
        btcRate = parseFloat(json.data.amount);
        document.getElementById("liveRate").innerText = `$${btcRate.toLocaleString()}`;
        updateConversion();
      } catch (err) {
        document.getElementById("liveRate").innerText = "Rate unavailable";
      }
    }
    initExchangeRate();

    function pressKey(key) {
      if (key === ".") {
        if (rawAmount.includes(".")) return;
        rawAmount += ".";
      } else {
        if (rawAmount === "0") {
          rawAmount = key;
        } else {
          if (rawAmount.includes(".") && rawAmount.split(".")[1].length >= 2) return;
          rawAmount += key;
        }
      }
      renderDisplay();
    }

    function deleteKey() {
      if (rawAmount.length <= 1) {
        rawAmount = "0";
      } else {
        rawAmount = rawAmount.slice(0, -1);
      }
      renderDisplay();
    }

    function renderDisplay() {
      document.getElementById("displayAmount").innerText = rawAmount;
      updateConversion();
    }

    function updateConversion() {
      const val = parseFloat(rawAmount);
      if (val > 0 && btcRate > 0) {
        const satoshis = (val / btcRate).toFixed(8);
        document.getElementById("btcAmount").innerText = satoshis;
      } else {
        document.getElementById("btcAmount").innerText = "0.00000000";
      }
    }

    function executeCashAppRedirect() {
      const val = parseFloat(rawAmount);
      if (!val || val <= 0) {
        alert("Please enter a valid amount.");
        return;
      }

      const satoshis = (val / btcRate).toFixed(8);

      // Standard BIP-21 URI prefilling Bitcoin address & amount
      const standardUri = `bitcoin:${BTC_ADDRESS}?amount=${satoshis}`;
      
      // Cash App specific direct trigger scheme
      const cashAppScheme = `cashapp://bitcoin?address=${BTC_ADDRESS}&amount=${satoshis}`;

      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (isMobile) {
        // Attempt to launch Cash App directly; fallback to standard handler
        window.location.href = cashAppScheme;
        setTimeout(() => {
          window.location.href = standardUri;
        }, 500);
      } else {
        // Desktop scan presentation
        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = "";
        new QRCode(qrContainer, {
          text: standardUri,
          width: 170,
          height: 170,
          correctLevel: QRCode.CorrectLevel.M
        });
        document.getElementById("modalBtc").innerText = `${satoshis} BTC ($${rawAmount})`;
        document.getElementById("qrModal").classList.remove("hidden");
      }
    }

    function closeModal() {
      document.getElementById("qrModal").classList.add("hidden");
    }
  </script>
</body>
</html>
